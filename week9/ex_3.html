<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Sign Up · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    :root { --ok: #1f7a4d; --ok-bg: #eaf6ef; --bad: #b42318; --bad-bg: #fdeceb; }
    @media (prefers-color-scheme: dark) {
      :root { --ok: #6fc49a; --ok-bg: #17291f; --bad: #f08a80; --bad-bg: #2e1b1a; }
    }
    .intro { margin: -16px 0 32px; color: var(--muted); font-size: 18px; line-height: 1.5; }
    h2 { margin: 0 0 16px; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 26px; }
    main p { margin: 0 0 16px; line-height: 1.6; }
    label { display: block; margin: 0 0 6px; font-weight: 600; }
    .ghost { background: transparent; color: var(--accent); }
    .message {
      margin: 16px 0 0; padding: 14px 16px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; line-height: 1.5;
    }
    .message:empty { margin: 0; padding: 0; border: 0; background: none; }

    .panel { margin-bottom: 24px; }
    form label { margin-top: 20px; }
    form label:first-child { margin-top: 0; }
    .error { min-height: 1.4em; margin: 6px 0 0 !important; color: var(--bad); font-size: 14px; }
    input:invalid:not(:placeholder-shown) { border-color: var(--bad); background: var(--bad-bg); }
    input:valid:not(:placeholder-shown) { border-color: var(--ok); background: var(--ok-bg); }
    .submit { width: 100%; margin-top: 8px; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 9</a>
    <h1>Accessible Sign Up</h1>
    <section class="panel">
      <h2>Find help</h2>

      <button
        type="button"
        id="search-button"
        class="ghost"
        aria-label="Show email and password guidance"
        aria-expanded="false"
        aria-controls="help"
      >? Help</button>

      <p id="help" class="message" hidden>
        Enter a valid email address and a password containing at least eight characters.
      </p>
    </section>

    <section class="panel">
      <h2>Create an account</h2>

      <form id="signup-form" novalidate>
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="name@example.com"
          aria-describedby="email-error"
          required
        >
        <p id="email-error" class="error"></p>

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="At least 8 characters"
          minlength="8"
          aria-describedby="password-error"
          required
        >
        <p id="password-error" class="error"></p>

        <p id="status" class="message" role="status" aria-live="polite"></p>

        <button type="submit" class="submit">Create account</button>
      </form>
    </section>
  </main>
  <script>
    const helpButton = document.getElementById('search-button');
    const help = document.getElementById('help');
    const form = document.getElementById('signup-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');

    helpButton.addEventListener('click', function() {
      help.hidden = !help.hidden;
      helpButton.setAttribute('aria-expanded', String(!help.hidden));
    });

    function checkEmail() {
      const error = document.getElementById('email-error');

      if (email.value === '') {
        error.textContent = '';
        email.removeAttribute('aria-invalid');
      } else if (!email.validity.valid) {
        error.textContent = 'Error: Please enter a valid email address.';
        email.setAttribute('aria-invalid', 'true');
      } else {
        error.textContent = '';
        email.setAttribute('aria-invalid', 'false');
      }
    }

    function checkPassword() {
      const error = document.getElementById('password-error');

      if (password.value === '') {
        error.textContent = '';
        password.removeAttribute('aria-invalid');
      } else if (password.value.length < 8) {
        error.textContent = 'Error: Password must be at least 8 characters.';
        password.setAttribute('aria-invalid', 'true');
      } else {
        error.textContent = '';
        password.setAttribute('aria-invalid', 'false');
      }
    }

    email.addEventListener('input', checkEmail);
    password.addEventListener('input', checkPassword);

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      checkEmail();
      checkPassword();

      if (!form.checkValidity()) {
        document.getElementById('status').textContent =
          'Please correct the errors before continuing.';
        form.reportValidity();
      } else {
        document.getElementById('status').textContent =
          'The form is valid. This demo does not create or save an account.';
      }
    });
  </script>
</body>
</html>
