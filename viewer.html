<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root { --bg:#f3f5f4; --ink:#1f2a33; --muted:#5d6b75; --accent:#2f6b4f; --card:#fff; --border:#dfe5e2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14191c; --ink:#e8eeea; --muted:#9aa8a1; --accent:#6fc49a; --card:#1c2327; --border:#2b363b; }
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      background: radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%), var(--bg);
      font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin:0 auto; padding:72px 24px 64px; }
    .back { display:inline-block; margin-bottom:32px; color:var(--accent); font-weight:500; text-decoration:none; }
    .back:hover, .back:focus-visible { text-decoration:underline; outline:none; }
    h1.page { margin:0 0 28px; font-family:"Source Serif 4", Georgia, serif; font-weight:500;
      font-size:clamp(36px,6vw,64px); line-height:1.05; letter-spacing:-.02em; }
    article { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 32px 28px; line-height:1.65; font-size:17px; }
    article h1, article h2, article h3 { font-family:"Source Serif 4", Georgia, serif; line-height:1.2; }
    article h1 { border-bottom:1px solid var(--border); padding-bottom:.3em; }
    article pre { overflow-x:auto; padding:14px; border-radius:8px; background:var(--bg); }
    article code { font-size:.92em; }
    article img { max-width:100%; }
    article a { color:var(--accent); }
    .msg { color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <a class="back" id="back" href="index.html">&larr; All weeks</a>
    <h1 class="page" id="title">Exercise</h1>
    <article id="content"><p class="msg">Loading…</p></article>
  </main>
  <script>
    (function () {
      var file = new URLSearchParams(location.search).get("file") || "";
      var content = document.getElementById("content");
      // only allow files like week2-1/ex-3.md
      var m = /^(week\d+-\d+)\/ex-(\d+)\.md$/.exec(file);
      if (!m) { content.innerHTML = '<p class="msg">No exercise selected. Go back and choose one.</p>'; return; }
      document.getElementById("title").textContent = "Exercise " + m[2];
      document.title = "Exercise " + m[2] + " · " + m[1];
      var back = document.getElementById("back");
      back.href = m[1] + "/";
      back.innerHTML = "&larr; " + m[1].replace("week", "Week ");
      fetch(file)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (text) { content.innerHTML = marked.parse(text); })
        .catch(function () {
          content.innerHTML = '<p class="msg">Could not load <a href="' + file + '">' + file + '</a>. Check that the file exists in the repo.</p>';
        });
    })();
  </script>
</body>
</html>
