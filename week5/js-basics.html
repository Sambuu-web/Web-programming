<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Basics · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    section.panel { margin-bottom: 24px; }
    section.panel:last-of-type { margin-bottom: 0; }
    h2 {
      margin: 0 0 16px;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
    }
    section p { margin: 0 0 16px; line-height: 1.5; }
    .row { display: flex; gap: 12px; margin: 0 0 16px; }
    .row button { flex-shrink: 0; }
    .result { min-height: 1.5em; margin: 0; color: var(--accent); font-weight: 500; }
    p.fruit-list { margin: 0; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 5</a>
    <h1>JavaScript Basics</h1>
    <section class="panel">
      <h2>Changing Content</h2>
      <p id="message">Original text</p>
      <button onclick="changeText()">Change text</button>
    </section>

    <section class="panel">
      <h2>Reading User Input</h2>
      <div class="row">
        <input type="text" id="nameInput" placeholder="Your name" aria-label="Your name">
        <button onclick="greet()">Greet</button>
      </div>
      <p id="output" class="result"></p>
    </section>

    <section class="panel">
      <h2>Condition (if / else)</h2>
      <p>Enter a score:</p>
      <div class="row">
        <input type="number" id="scoreInput" aria-label="Score">
        <button onclick="checkScore()">Check</button>
      </div>
      <p id="grade" class="result"></p>
    </section>

    <section class="panel">
      <h2>Loop (for)</h2>
      <p>Enter a number:</p>
      <div class="row">
        <input type="number" id="loopInput" aria-label="Number of steps">
        <button onclick="runLoop()">Run</button>
      </div>
      <p id="loop" class="result"></p>
    </section>

    <section class="panel">
      <h2>Loop Through an Array</h2>
      <p id="fruits" class="fruit-list"></p>
    </section>

    <section class="panel">
      <h2>localStorage</h2>
      <p id="saved" class="result"></p>
    </section>
  </main>
  <script>
    let name = 'Batnasan Erdenesambuu';
    const MAX = 100;

    console.log(name);

    function changeText() {
      let el = document.getElementById('message');
      el.textContent = 'Text was changed!';
      el.style.color = 'red';
    }

    function greet() {
      let name = document.getElementById('nameInput').value;
      document.getElementById('output').textContent = 'Hello, ' + name + '!';
      localStorage.setItem('name', name);
    }

    function checkScore() {
      let score = document.getElementById('scoreInput').value;

      localStorage.setItem('score', score);

      if (score >= 90) {
        document.getElementById('grade').textContent = 'Grade: A';
      } else if (score >= 80) {
        document.getElementById('grade').textContent = 'Grade: B';
      } else if (score >= 70) {
        document.getElementById('grade').textContent = 'Grade: C';
      } else {
        document.getElementById('grade').textContent = 'Grade: F';
      }
    }

    function runLoop() {
      let number = document.getElementById('loopInput').value;

      localStorage.setItem('loopNumber', number);

      let result = '';

      for (let i = 1; i <= number; i++) {
        result += 'Step ' + i + '<br>';
      }

      document.getElementById('loop').innerHTML = result;
    }

    let fruits = ['apple', 'banana', 'cherry'];
    let fruitResult = '';

    for (let fruit of fruits) {
      fruitResult += fruit + '<br>';
    }

    document.getElementById('fruits').innerHTML = fruitResult;

    let savedName = localStorage.getItem('name');
    let savedScore = localStorage.getItem('score');
    let savedLoopNumber = localStorage.getItem('loopNumber');

    if (savedName !== null) {
      document.getElementById('nameInput').value = savedName;
      document.getElementById('output').textContent = 'Hello, ' + savedName + '!';
    }

    if (savedScore !== null) {
      document.getElementById('scoreInput').value = savedScore;

      if (savedScore >= 90) {
        document.getElementById('grade').textContent = 'Grade: A';
      } else if (savedScore >= 80) {
        document.getElementById('grade').textContent = 'Grade: B';
      } else if (savedScore >= 70) {
        document.getElementById('grade').textContent = 'Grade: C';
      } else {
        document.getElementById('grade').textContent = 'Grade: F';
      }
    }

    if (savedLoopNumber !== null) {
      document.getElementById('loopInput').value = savedLoopNumber;

      let savedResult = '';

      for (let i = 1; i <= savedLoopNumber; i++) {
        savedResult += 'Step ' + i + '<br>';
      }

      document.getElementById('loop').innerHTML = savedResult;
    }

    localStorage.setItem('username', 'Batnasan Erdenesambuu');
    document.getElementById('saved').textContent =
      'Saved name: ' + localStorage.getItem('username');
  </script>
</body>
</html>
