<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>
   Batnasan Erdenesambuu CSS Advanced Page
  </title>
  <style>
:root {
  --primary:#0f766e;
  --accent:#14b8a6;
  --bg:#f0fdfa;
  --text:#1e293b;
  --radius:12px;
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg:#051a0a;
    --text:#d4edda;
  }
}
*,*::before,*::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}
body {
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
}
nav {
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  background:#1e293b;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 32px;
}
nav span {
  color:var(--accent);
  font-weight:bold;
  font-size:1.2rem;
}
nav a {
  color:#94a3b8;
  text-decoration:none;
  margin-left:20px;
}
nav a:hover {
  color:var(--accent);
}
@keyframes fadeSlideIn {
  from {
    opacity:0;
    transform:translateY(28px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}
.hero {
  padding:140px 40px 80px;
  text-align:center;
  background:linear-gradient(135deg,var(--bg) 0%,#ccfbf1 100%);
}
.hero h1 {
  font-size:2.5rem;
  color:var(--primary);
  animation:fadeSlideIn .8s ease-out forwards;
  margin-bottom:12px;
}
.hero p {
  font-size:1.1rem;
  color:#64748b;
}
.skills-section {
  padding:0 24px 60px;
}
.sticky-h2 {
  position:sticky;
  top:56px;
  background:var(--bg);
  color:var(--primary);
  font-size:1.4rem;
  padding:14px 0 10px;
  border-bottom:3px solid var(--accent);
  margin-bottom:20px;
}
.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:640px) {
  .grid {
    grid-template-columns:repeat(3,1fr);
  }
}
.card {
  border:2px solid var(--accent);
  border-radius:var(--radius);
  padding:24px;
  background:var(--bg);
  color:var(--text);
  transition:transform .25s ease,box-shadow .25s ease;
}
.card:hover {
  transform:translateY(-5px);
  box-shadow:0 10px 28px rgba(15,118,110,.18);
}
.card[data-icon]::before {
  content:attr(data-icon);
  display:block;
  font-size:2rem;
  margin-bottom:10px;
}
  </style>

      font: 600 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }
    .wk-back:hover, .wk-back:focus-visible { border-color: #2f6b4f; outline: none; }
    @media (prefers-color-scheme: dark) {
      .wk-back { background: #1c2327; color: #6fc49a; border-color: #2b363b; }
    }
  </style>
</head>

   </p>
  </section>
  <section class="skills-section">
   <h2 class="sticky-h2">
    My Skills
   </h2>
   <div class="grid">
    <div class="card" data-icon="🔎">
     Researching
    </div>
    <div class="card" data-icon="💬">

    <div class="card" data-icon="🧠">
