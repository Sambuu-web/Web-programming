<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  
  <title>Exercise 4 - Week 3_2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --primary:#0f766e;
  --accent:#14b8a6;
  --bg:#f0fdfa;
  --text:#1e293b;
  --radius:10px;
}
@media(prefers-color-scheme:dark) {
  :root {
    --bg:#051a0a;
    --text:#d4edda;
  }
}
body {
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
  padding:20px;
}
.btn {
  background:var(--primary);
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:var(--radius);
  cursor:pointer;
}
.btn:hover {
  background:var(--accent);
}
.card {
  background:var(--bg);
  border:2px solid var(--accent);
  border-radius:var(--radius);
  padding:20px;
  margin-top:16px;
}
  </style>
   <style>
    .wk-back {
      position: fixed; right: 16px; bottom: 16px; z-index: 2147483647;
      padding: 9px 16px; background: #ffffff; color: #2f6b4f;
      border: 1px solid #dfe5e2; border-radius: 999px;
      font: 600 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }
    .wk-back:hover, .wk-back:focus-visible { border-color: #2f6b4f; outline: none; }
    @media (prefers-color-scheme: dark) {
      .wk-back { background: #1c2327; color: #6fc49a; border-color: #2b363b; }
    }
  </style>
</head>
 <body>
  <button class="btn">
   Click Me
  </button>
  <div class="card">
   A themed card using CSS variables
  </div>
   <a class="wk-back" href="index.html">&larr; Week 3_2</a>
</body>
</html>
