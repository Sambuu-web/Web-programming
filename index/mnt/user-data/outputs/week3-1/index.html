  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4; --ink: #1f2a33; --muted: #5d6b75;
      --accent: #2f6b4f; --card: #ffffff; --border: #dfe5e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c; --ink: #e8eeea; --muted: #9aa8a1;
        --accent: #6fc49a; --card: #1c2327; --border: #2b363b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%), var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1120px; margin: 0 auto; padding: 72px 24px 64px; }
    .back {
      display: inline-block; margin-bottom: 40px;
      color: var(--accent); font-weight: 500; text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    .eyebrow {
      margin: 0 0 20px; color: var(--accent); font-size: 14px;
      font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    }
    h1 {
      margin: 0 0 20px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500; font-size: clamp(44px, 8vw, 96px);
      line-height: 1.05; letter-spacing: -.02em;
    }
    .lead { margin: 0 0 56px; color: var(--muted); font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
    .card {
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 170px; padding: 28px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      color: inherit; text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px); border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(0,0,0,.08); outline: none;
    }
    .card h2 { margin: 0 0 10px; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 30px; }
    .card p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
    .arrow { align-self: flex-end; margin-top: 12px; color: var(--accent); font-size: 24px; line-height: 1; }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
