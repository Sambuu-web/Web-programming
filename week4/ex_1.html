<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    .counter { text-align: center; }
    .counter button { background: transparent; color: var(--accent); }
    .counter button.done { background: var(--accent); color: var(--on-accent); }
    .count-line { margin: 24px 0 0; font-size: 20px; }
    .count-line span { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 32px; }
    #message { min-height: 1.5em; margin: 12px 0 0; color: var(--accent); font-weight: 500; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 4</a>
    <h1>Click Counter</h1>
    <section class="panel counter">
      <button id="clicker">Click me</button>
      <p class="count-line">Clicks: <span id="count">0</span></p>
      <p id="message" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const btn = document.querySelector('#clicker');
    const countEl = document.querySelector('#count');
    const msg = document.querySelector('#message');
    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      countEl.textContent = count;

      if (count >= 5) {
        btn.classList.add('done');
        msg.textContent = '🎉 Congratulations! You clicked 5 times!';
      }
    });
  </script>
</body>
</html>
