<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 4 · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    #search { margin: 0 0 24px; }
    .student {
      padding: 14px 16px;
      margin-bottom: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    #no-results { display: none; margin: 0; padding: 12px 0 4px; text-align: center; color: var(--muted); }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 4</a>
    <h1>Student Search</h1>
    <section class="panel">
      <input id="search" type="text" placeholder="Search students..." aria-label="Search students">

      <div id="student-list">
        <div class="student" data-name="Batnasan Erdenesambuu">Batnasan Erdenesambuu — Computer Engineering</div>
        <div class="student" data-name="Bat">Bat — Computer Science</div>
        <div class="student" data-name="Min">Min — Software Engineering</div>
        <div class="student" data-name="Jin">Jin — Artificial Intelligence</div>
        <div class="student" data-name="Yuna">Yuna — Data Science</div>
        <div class="student" data-name="Seojun">Seojun — Web Programming</div>
      </div>

      <p id="no-results">No students found.</p>
    </section>
  </main>
  <script>
    const searchInp = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    searchInp.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      let visible = 0;

      students.forEach(s => {
        const name = s.dataset.name.toLowerCase();

        if (name.includes(term)) {
          s.style.display = '';
          visible++;
        } else {
          s.style.display = 'none';
        }
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
  </script>
</body>
</html>
