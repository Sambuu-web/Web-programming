<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokéAPI · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
    }
    h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    main p { margin: 0 0 16px; line-height: 1.5; }
    .intro { margin: -16px 0 32px; color: var(--muted); font-size: 18px; }
    .panel { margin-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }
    .row input { flex: 1; min-width: 180px; }
    .row button { flex-shrink: 0; }
    .status { min-height: 1.5em; color: var(--muted); }
    .ghost { background: transparent; color: var(--accent); }
    .detail { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--border); }
    #error { color: var(--danger); }

    #sprite { display: block; width: 180px; height: 180px; margin: 0 0 16px; object-fit: contain; }
    #name { text-transform: capitalize; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    h2.sub { margin-top: 24px; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 6</a>
    <h1>PokéAPI</h1>
    <p class="intro">Search the Pokémon database by name or Pokédex number.</p>

    <section class="panel">
      <div class="row">
        <input type="text" id="pokemonInput" placeholder="Pikachu or 25" aria-label="Pokémon name or number">
        <button onclick="searchPokemon()">Search</button>
        <button class="ghost" onclick="randomPokemon()">Random Pokémon</button>
      </div>

      <p id="status" class="status"></p>
    </section>

    <section id="details" class="panel" hidden>
      <h2 id="name"></h2>
      <img id="sprite" alt="Pokémon image">

      <p id="types"></p>
      <p id="height"></p>
      <p id="weight"></p>
      <p id="abilities"></p>

      <h2 class="sub">Base Stats</h2>

      <table>
        <thead>
          <tr>
            <th>Stat</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="stats"></tbody>
      </table>
    </section>
  </main>
  <script>
    async function searchPokemon() {
      let value = document.getElementById('pokemonInput').value.trim().toLowerCase();

      if (value === '') {
        document.getElementById('status').textContent =
          'Enter a Pokémon name or number.';
        return;
      }

      await loadPokemon(value);
    }

    async function loadPokemon(value) {
      let status = document.getElementById('status');
      let details = document.getElementById('details');

      status.textContent = 'Loading Pokémon...';
      details.hidden = true;

      try {
        const res = await fetch(
          'https://pokeapi.co/api/v2/pokemon/' + encodeURIComponent(value)
        );

        if (!res.ok) {
          throw new Error('Pokémon not found');
        }

        const data = await res.json();

        document.getElementById('name').textContent =
          '#' + data.id + ' ' +
          data.name.charAt(0).toUpperCase() + data.name.slice(1);

        let sprite = data.sprites.other['official-artwork'].front_default
          || data.sprites.front_default;

        document.getElementById('sprite').src = sprite || '';
        document.getElementById('types').textContent =
          'Types: ' + data.types.map(item => item.type.name).join(', ');

        document.getElementById('height').textContent =
          'Height: ' + data.height / 10 + ' m';

        document.getElementById('weight').textContent =
          'Weight: ' + data.weight / 10 + ' kg';

        document.getElementById('abilities').textContent =
          'Abilities: ' + data.abilities
            .map(item => item.ability.name)
            .join(', ');

        let stats = document.getElementById('stats');
        stats.textContent = '';

        for (let item of data.stats) {
          let row = document.createElement('tr');
          let statName = document.createElement('td');
          let statValue = document.createElement('td');

          statName.textContent = item.stat.name;
          statValue.textContent = item.base_stat;

          row.appendChild(statName);
          row.appendChild(statValue);
          stats.appendChild(row);
        }

        status.textContent = 'Pokémon loaded!';
        details.hidden = false;
      } catch (error) {
        status.textContent =
          'Pokémon not found or the API is unavailable. Try another name or number.';
      }
    }

    async function randomPokemon() {
      let status = document.getElementById('status');
      status.textContent = 'Finding a random Pokémon...';

      try {
        const res = await fetch(
          'https://pokeapi.co/api/v2/pokemon?limit=1'
        );

        if (!res.ok) {
          throw new Error('Request failed');
        }

        const data = await res.json();
        let id = Math.floor(Math.random() * data.count) + 1;

        document.getElementById('pokemonInput').value = id;
        await loadPokemon(id);
      } catch (error) {
        status.textContent =
          'Could not get a random Pokémon. Please try again.';
      }
    }

    document.getElementById('pokemonInput').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        searchPokemon();
      }
    });

    loadPokemon('pikachu');
  </script>
</body>
</html>
