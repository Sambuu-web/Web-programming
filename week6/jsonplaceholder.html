<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSONPlaceholder · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
    }
    h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    main p { margin: 0 0 16px; line-height: 1.5; }
    .intro { margin: -16px 0 32px; color: var(--muted); font-size: 18px; }
    .panel { margin-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }
    .row input { flex: 1; min-width: 180px; }
    .row button { flex-shrink: 0; }
    .status { min-height: 1.5em; color: var(--muted); }
    .ghost { background: transparent; color: var(--accent); }
    .detail { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--border); }
    #error { color: var(--danger); }

    label { display: block; margin: 0 0 6px; font-weight: 600; }
    textarea {
      display: block; width: 100%; min-height: 110px; margin: 0 0 16px; padding: 11px 14px;
      background: var(--bg); color: var(--ink); border: 1px solid var(--border);
      border-radius: 10px; font: 400 16px "Inter", system-ui, sans-serif; resize: vertical;
    }
    textarea:focus { border-color: var(--accent); outline: none; }
    textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #postTitle, #newTodo { margin: 0 0 16px; }
    #previewTitle { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 24px; color: var(--ink); }
    #previewAuthor { color: var(--muted); }
    .status { color: var(--accent); }
    .todo { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .todo input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); }
    .todo input[type="text"] { flex: 1; min-width: 0; }
    .todo button { padding: 8px 14px; background: transparent; color: var(--danger); border-color: var(--danger); font-size: 14px; }
    .completed { text-decoration: line-through; color: var(--muted); }
    #todoStatus { margin: 16px 0 0; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 6</a>
    <h1>JSONPlaceholder</h1>
    <section class="panel">
      <h2>Post Author</h2>
      <p id="userStatus" class="status">Loading user...</p>
      <div id="user"></div>
      <button class="ghost" onclick="loadUser(true)">Random user</button>
    </section>

    <section class="panel">
      <h2>Edit Blog Post</h2>

      <label for="postTitle">Post title</label>
      <input type="text" id="postTitle">

      <label for="postBody">Post content</label>
      <textarea id="postBody"></textarea>

      <button onclick="savePost()">Save post</button>
      <p id="postStatus" class="status"></p>

      <h2>Post Preview</h2>
      <h3 id="previewTitle"></h3>
      <p id="previewAuthor"></p>
      <p id="previewBody"></p>
    </section>

    <section class="panel">
      <h2>My Todos</h2>
      <p>Check off tasks, edit their names, or remove them.</p>

      <div class="row">
        <input type="text" id="newTodo" placeholder="Enter a new task" aria-label="New task">
        <button onclick="addTodo()">Add todo</button>
      </div>

      <div id="todos"></div>
      <p id="todoStatus" class="status"></p>
    </section>
  </main>
  <script>
    let currentUser = null;

    let todos = JSON.parse(localStorage.getItem('week6Todos') || 'null') || [
      { text: 'Practice JavaScript fetch()', completed: false },
      { text: 'Learn async and await', completed: false },
      { text: 'Finish my web programming assignment', completed: false }
    ];

    document.getElementById('postTitle').value =
      localStorage.getItem('week6PostTitle') || 'My Week 6 Learning Journey';

    document.getElementById('postBody').value =
      localStorage.getItem('week6PostBody') ||
      'Today I practiced JavaScript and learned how to fetch data from an API. I also learned how to work with users, edit content, and manage a todo list.';

    function updatePreview() {
      document.getElementById('previewTitle').textContent =
        document.getElementById('postTitle').value;

      document.getElementById('previewBody').textContent =
        document.getElementById('postBody').value;

      document.getElementById('previewAuthor').textContent =
        currentUser ? 'Written by ' + currentUser.name : 'Loading author...';
    }

    async function loadUser(randomize) {
      let id = randomize
        ? Math.floor(Math.random() * 10) + 1
        : Number(localStorage.getItem('week6UserId')) || 1;

      document.getElementById('userStatus').textContent = 'Loading user...';

      try {
        const res = await fetch(
          'https://jsonplaceholder.typicode.com/users/' + id
        );

        if (!res.ok) {
          throw new Error('User request failed');
        }

        currentUser = await res.json();

        localStorage.setItem('week6UserId', currentUser.id);

        document.getElementById('user').textContent = '';

        let name = document.createElement('p');
        name.textContent = 'Name: ' + currentUser.name;

        let username = document.createElement('p');
        username.textContent = 'Username: ' + currentUser.username;

        let email = document.createElement('p');
        email.textContent = 'Email: ' + currentUser.email;

        document.getElementById('user').appendChild(name);
        document.getElementById('user').appendChild(username);
        document.getElementById('user').appendChild(email);

        document.getElementById('userStatus').textContent =
          'User profile loaded from JSONPlaceholder.';

        updatePreview();
      } catch (error) {
        document.getElementById('userStatus').textContent =
          'Could not load a user. Please try again.';
      }
    }

    function savePost() {
      localStorage.setItem(
        'week6PostTitle',
        document.getElementById('postTitle').value
      );

      localStorage.setItem(
        'week6PostBody',
        document.getElementById('postBody').value
      );

      updatePreview();

      document.getElementById('postStatus').textContent =
        'Post saved in this browser.';
    }

    function saveTodos() {
      localStorage.setItem('week6Todos', JSON.stringify(todos));
    }

    function showTodos() {
      let output = document.getElementById('todos');
      output.textContent = '';

      for (let todo of todos) {
        let row = document.createElement('div');
        row.className = 'todo';

        let checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;

        let text = document.createElement('input');
        text.type = 'text';
        text.value = todo.text;

        if (todo.completed) {
          text.className = 'completed';
        }

        let remove = document.createElement('button');
        remove.textContent = 'Delete';

        checkbox.addEventListener('change', function () {
          todo.completed = checkbox.checked;
          saveTodos();
          showTodos();
        });

        text.addEventListener('change', function () {
          todo.text = text.value;
          saveTodos();
        });

        remove.addEventListener('click', function () {
          todos = todos.filter(item => item !== todo);
          saveTodos();
          showTodos();
        });

        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(remove);
        output.appendChild(row);
      }

      let completed = todos.filter(todo => todo.completed).length;

      document.getElementById('todoStatus').textContent =
        completed + ' of ' + todos.length + ' tasks completed.';
    }

    function addTodo() {
      let input = document.getElementById('newTodo');
      let text = input.value.trim();

      if (text === '') {
        return;
      }

      todos.push({ text: text, completed: false });
      input.value = '';

      saveTodos();
      showTodos();
    }

    document.getElementById('postTitle').addEventListener('input', updatePreview);
    document.getElementById('postBody').addEventListener('input', updatePreview);

    document.getElementById('newTodo').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTodo();
      }
    });

    showTodos();
    updatePreview();
    loadUser(false);
  </script>
</body>
</html>
