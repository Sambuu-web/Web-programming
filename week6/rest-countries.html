<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REST Countries · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
    }
    h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    main p { margin: 0 0 16px; line-height: 1.5; }
    .intro { margin: -16px 0 32px; color: var(--muted); font-size: 18px; }
    .panel { margin-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }
    .row input { flex: 1; min-width: 180px; }
    .row button { flex-shrink: 0; }
    .status { min-height: 1.5em; color: var(--muted); }
    .ghost { background: transparent; color: var(--accent); }
    .detail { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--border); }
    #error { color: var(--danger); }

    #results section {
      margin: 0 0 16px; padding: 24px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 14px;
    }
    #results h2 { font-size: 24px; margin-bottom: 16px; }
    .flag { display: block; max-width: 180px; max-height: 120px; margin: 0 0 16px; border-radius: 6px; }
    #results .detail:last-child { border-bottom: 0; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 6</a>
    <h1>REST Countries</h1>
    <p class="intro">Search for a country to explore its flag, capital and population.</p>

    <section class="panel">
      <div class="row">
        <input type="text" id="countryInput" value="Mongolia" placeholder="Enter a country name" aria-label="Country name">
        <button onclick="searchCountry()">Search</button>
      </div>

      <p id="status" class="status">Loading country...</p>
      <div id="results"></div>
    </section>
  </main>
  <script>
    async function searchCountry() {
      let name = document.getElementById('countryInput').value.trim();
      let status = document.getElementById('status');
      let output = document.getElementById('results');

      output.textContent = '';

      if (name === '') {
        status.textContent = 'Please enter a country name.';
        return;
      }

      status.textContent = 'Searching...';

      try {
        let query = name;

        if (name.toLowerCase() === 'south korea') {
          query = 'Korea';
        }

        if (name.toLowerCase() === 'north korea') {
          query = 'Korea';
        }

        const res = await fetch(
          'https://countries.dev/name/' + encodeURIComponent(query)
        );

        if (!res.ok) {
          throw new Error('Country not found');
        }

        let data = await res.json();

        if (!Array.isArray(data)) {
          throw new Error('Invalid response');
        }

        if (name.toLowerCase() === 'south korea') {
          data = data.filter(country => country.alpha2Code === 'KR');
        }

        if (name.toLowerCase() === 'north korea') {
          data = data.filter(country => country.alpha2Code === 'KP');
        }

        if (data.length === 0) {
          throw new Error('Country not found');
        }

        status.textContent = data.length + ' result(s) found.';

        for (let country of data) {
          let card = document.createElement('section');

          let title = document.createElement('h2');
          title.textContent = country.name;

          let flag = document.createElement('img');
          flag.className = 'flag';
          flag.alt = country.name + ' flag';

          if (country.flags && country.flags.png) {
            flag.src = country.flags.png;
          } else if (country.flags && country.flags.svg) {
            flag.src = country.flags.svg;
          } else {
            flag.src = 'https://countries.dev/flags/' +
              country.alpha2Code.toLowerCase() + '.svg';
          }

          let capital = document.createElement('p');
          capital.className = 'detail';
          capital.textContent = 'Capital: ' +
            (country.capital || 'Not available');

          let population = document.createElement('p');
          population.className = 'detail';
          population.textContent = 'Population: ' +
            (country.population != null
              ? country.population.toLocaleString()
              : 'Not available');

          let region = document.createElement('p');
          region.className = 'detail';
          region.textContent = 'Region: ' +
            (country.region || 'Not available');

          let area = document.createElement('p');
          area.className = 'detail';
          area.textContent = 'Area: ' +
            (country.area != null
              ? country.area.toLocaleString() + ' km²'
              : 'Not available');

          card.appendChild(title);
          card.appendChild(flag);
          card.appendChild(capital);
          card.appendChild(population);
          card.appendChild(region);
          card.appendChild(area);

          output.appendChild(card);
        }

      } catch (error) {
        status.textContent =
          'Country not found or the service is unavailable. Please try another name.';
      }
    }

    document.getElementById('countryInput').addEventListener(
      'keydown',
      function(event) {
        if (event.key === 'Enter') {
          searchCountry();
        }
      }
    );

    searchCountry();
  </script>
</body>
</html>
