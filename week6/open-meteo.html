<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seoul Weather · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
    }
    h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    main p { margin: 0 0 16px; line-height: 1.5; }
    .intro { margin: -16px 0 32px; color: var(--muted); font-size: 18px; }
    .panel { margin-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }
    .row input { flex: 1; min-width: 180px; }
    .row button { flex-shrink: 0; }
    .status { min-height: 1.5em; color: var(--muted); }
    .ghost { background: transparent; color: var(--accent); }
    .detail { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--border); }
    #error { color: var(--danger); }

    #condition { margin: 24px 0 0; }
    #temperature {
      margin: 0 0 20px; font-family: "Source Serif 4", Georgia, serif;
      font-weight: 500; font-size: 64px; line-height: 1.1; color: var(--ink);
    }
    #details { margin: 0 0 16px; }
    #updated { margin: 0; color: var(--muted); }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 6</a>
    <h1>Seoul Weather</h1>
    <p class="intro">Current weather in Seoul, South Korea.</p>

    <section class="panel">
      <button onclick="loadWeather()">Refresh weather</button>
      <p id="status" class="status" style="margin-top:16px">Loading weather...</p>

      <h2 id="condition">--</h2>
      <p id="temperature">-- °C</p>

      <div id="details"></div>
      <p id="updated"></p>
    </section>
  </main>
  <script>
    function getCondition(code) {
      if (code === 0) return 'Clear sky';
      if (code === 1) return 'Mainly clear';
      if (code === 2) return 'Partly cloudy';
      if (code === 3) return 'Overcast';
      if (code === 45 || code === 48) return 'Fog';
      if (code >= 51 && code <= 57) return 'Drizzle';
      if (code >= 61 && code <= 67) return 'Rain';
      if (code >= 71 && code <= 77) return 'Snow';
      if (code >= 80 && code <= 82) return 'Rain showers';
      if (code === 85 || code === 86) return 'Snow showers';
      if (code >= 95) return 'Thunderstorm';
      return 'Weather conditions unavailable';
    }

    async function loadWeather() {
      document.getElementById('status').textContent = 'Loading latest weather...';
      document.getElementById('details').textContent = '';

      try {
        const res = await fetch(
          'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=Asia%2FSeoul'
        );

        if (!res.ok) {
          throw new Error('Weather request failed');
        }

        const data = await res.json();
        const weather = data.current;

        document.getElementById('condition').textContent =
          getCondition(weather.weather_code);

        document.getElementById('temperature').textContent =
          weather.temperature_2m + ' °C';

        let details = [
          ['Feels like', weather.apparent_temperature + ' °C'],
          ['Humidity', weather.relative_humidity_2m + '%'],
          ['Wind speed', weather.wind_speed_10m + ' km/h'],
          ['Weather data time', weather.time.replace('T', ' ') + ' (Seoul time)']
        ];

        let output = document.getElementById('details');

        for (let item of details) {
          let row = document.createElement('p');
          row.className = 'detail';
          row.textContent = item[0] + ': ' + item[1];
          output.appendChild(row);
        }

        let updated = new Date().toLocaleTimeString('en-GB', {
          timeZone: 'Asia/Seoul',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });

        document.getElementById('updated').textContent =
          'Checked at ' + updated + ' Korea time.';

        document.getElementById('status').textContent =
          'Latest weather data loaded.';
      } catch (error) {
        document.getElementById('status').textContent =
          'Could not load weather. Please try refreshing.';
      }
    }

    loadWeather();
  </script>
</body>
</html>
