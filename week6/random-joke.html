<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Joke Fetcher · Web Programming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f5f4;
      --ink: #1f2a33;
      --muted: #5d6b75;
      --accent: #2f6b4f;
      --on-accent: #ffffff;
      --card: #ffffff;
      --border: #dfe5e2;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14191c;
        --ink: #e8eeea;
        --muted: #9aa8a1;
        --accent: #6fc49a;
        --on-accent: #14191c;
        --card: #1c2327;
        --border: #2b363b;
        --danger: #f08a80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 40% 0%, rgba(47,107,79,.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 64px;
    }
    .back {
      display: inline-block;
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .back:hover, .back:focus-visible { text-decoration: underline; outline: none; }
    h1 {
      margin: 0 0 40px;
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .panel {
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .muted { color: var(--muted); }
    button {
      padding: 11px 20px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      font: 600 16px "Inter", system-ui, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.1); }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: 400 16px "Inter", system-ui, sans-serif;
    }
    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); outline: none; }
    input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      button:hover { transform: none; }
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: 26px;
    }
    h3 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
    main p { margin: 0 0 16px; line-height: 1.5; }
    .intro { margin: -16px 0 32px; color: var(--muted); font-size: 18px; }
    .panel { margin-bottom: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }
    .row input { flex: 1; min-width: 180px; }
    .row button { flex-shrink: 0; }
    .status { min-height: 1.5em; color: var(--muted); }
    .ghost { background: transparent; color: var(--accent); }
    .detail { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--border); }
    #error { color: var(--danger); }

    h3 { color: var(--muted); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .spinner {
      display: none; width: 20px; height: 20px; vertical-align: middle;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    #favourites > div { border-bottom: 1px solid var(--border) !important; }
    #favourites > div:last-child { border-bottom: 0 !important; }

  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">&larr; Week 6</a>
    <h1>Random Joke Fetcher</h1>
    <section class="panel">
      <div class="row">
        <button id="loadButton" onclick="loadJoke()">Load joke</button>
        <span id="spinner" class="spinner"></span>
      </div>

      <p id="status" class="status"></p>
      <p id="error"></p>

      <h3>Setup</h3>
      <p id="jokeSetup">Click Load joke to get a joke.</p>

      <h3>Punchline</h3>
      <p id="jokePunch"></p>

      <button id="saveButton" class="ghost" onclick="saveFavourite()" disabled>Save favourite</button>
    </section>

    <section class="panel">
      <h2>Favourite Jokes</h2>
      <div id="favourites"></div>
    </section>
  </main>
  <script>
    let currentJoke = null;

    async function loadJoke() {
      let button = document.getElementById('loadButton');
      let spinner = document.getElementById('spinner');

      button.disabled = true;
      document.getElementById('saveButton').disabled = true;
      spinner.style.display = 'inline-block';
      document.getElementById('status').textContent = 'Loading…';
      document.getElementById('error').textContent = '';
      document.getElementById('jokeSetup').textContent = '';
      document.getElementById('jokePunch').textContent = '';
      currentJoke = null;

      try {
        const res = await fetch(
          'https://official-joke-api.appspot.com/random_joke'
        );

        if (!res.ok) {
          throw new Error('Request failed');
        }

        const data = await res.json();

        currentJoke = {
          setup: data.setup,
          punchline: data.punchline
        };

        document.getElementById('jokeSetup').textContent = data.setup;
        document.getElementById('jokePunch').textContent = data.punchline;
        document.getElementById('status').textContent = 'Joke loaded!';
        document.getElementById('saveButton').disabled = false;

      } catch (err) {
        document.getElementById('status').textContent = '';
        document.getElementById('error').textContent =
          'Sorry, the joke could not be loaded. Please try again.';
      } finally {
        button.disabled = false;
        spinner.style.display = 'none';
      }
    }

    function saveFavourite() {
      if (currentJoke === null) {
        return;
      }

      let favourites = JSON.parse(
        localStorage.getItem('favoriteJokes') || '[]'
      );

      favourites.push(currentJoke);

      localStorage.setItem('favoriteJokes', JSON.stringify(favourites));

      showFavourites();
      document.getElementById('status').textContent = 'Favourite saved!';
    }

    function showFavourites() {
      let favourites = JSON.parse(
        localStorage.getItem('favoriteJokes') || '[]'
      );

      let list = document.getElementById('favourites');
      list.textContent = '';

      if (favourites.length === 0) {
        list.textContent = 'No favourite jokes saved yet.';
      }

      for (let joke of favourites) {
        let item = document.createElement('div');
        let setup = document.createElement('p');
        let punchline = document.createElement('p');

        setup.textContent = joke.setup;
        punchline.textContent = joke.punchline;

        item.appendChild(setup);
        item.appendChild(punchline);
        item.style.borderBottom = '1px solid #ddd';
        item.style.padding = '10px 0';

        list.appendChild(item);
      }
    }

    showFavourites();
  </script>
</body>
</html>
